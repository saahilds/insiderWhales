[project]
name = "insider-whales"
version = "0.1.0"
description = "Reproducible research framework testing whether disclosed US corporate insider trades predict risk-adjusted excess returns."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1",
    "exchange-calendars>=4.5",
    "httpx>=0.27",
    "numpy>=2.0",
    "plotly>=5.24",
    "polars>=1.10",
    "pyarrow>=17",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "scipy>=1.14",
    "statsmodels>=0.14",
    "typer>=0.12",
]

[project.scripts]
insider-whales = "insider_whales.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insider_whales"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "DTZ"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra -m 'not network'"
filterwarnings = [
    "ignore::DeprecationWarning:exchange_calendars.*",
    "ignore:Series.values returning an ndarray:Warning",
]
markers = [
    "network: test needs internet access (excluded from CI)",
]
